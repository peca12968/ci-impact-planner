name: Verify catalog-merge system
'on':
- push
- pull_request
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
    - run: python -m unittest -v
    - run: python demo.py
    - run: npm ci --prefix modules/message-parity --ignore-scripts
    - run: python icu_demo.py
  message-parity-verify:
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
        node:
        - '22'
        - '24'
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node }}
    - run: npm ci --ignore-scripts
    - run: npm test
    - run: npm run demo
    defaults:
      run:
        working-directory: modules/message-parity
