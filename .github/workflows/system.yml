name: Verify ci-impact-planner system
'on':
- push
- pull_request
permissions:
  contents: read
jobs:
  suite-integration:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/checkout@v4
      with:
        ref: 995bdcef3dbfdba4d2db23e2b65d5e7e514fcd0d
        path: suite-balance
        persist-credentials: false
    - run: python examples/balance_stages.py suite-balance/suite_balance.py
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node:
        - '22'
        - '24'
        os:
        - ubuntu-latest
        - windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node }}
    - run: npm test
    - run: npm run demo
    - name: Exercise Git-to-planner pipeline
      shell: bash
      run: |-
        set -o pipefail
        fixture=$(mktemp -d)
        git init -q "$fixture"
        mkdir -p "$fixture/apps/docs" "$fixture/apps/web"
        echo "example" > "$fixture/apps/docs/example.txt"
        git -C "$fixture" add .
        git -C "$fixture" -c user.name=Fixture -c user.email=fixture@example.invalid commit -qm "Fixture"
        git -C "$fixture" mv apps/docs/example.txt apps/web/example.txt
        git -C "$fixture" diff --cached --no-renames --name-only -z | node cli.js examples/projects.json --stdin0 > "$RUNNER_TEMP/impact.json"
        node -e "const p=require(process.argv[1]); if(p.selected !== 3 || p.direct.join(',') !== 'docs,web') process.exit(1)" "$RUNNER_TEMP/impact.json"
  suite-balance-verify:
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - run: python -m pip install pytest==9.2.0
    - run: python pytest_drill.py
    defaults:
      run:
        working-directory: modules/suite-balance
  catalog-merge-verify:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
    - run: python -m unittest -v
    - run: python demo.py
    - run: npm ci --prefix modules/message-parity --ignore-scripts
    - run: python icu_demo.py
    defaults:
      run:
        working-directory: modules/catalog-merge
  catalog-merge-message-parity-verify:
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
        node:
        - '22'
        - '24'
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node }}
    - run: npm ci --ignore-scripts
    - run: npm test
    - run: npm run demo
    defaults:
      run:
        working-directory: modules/catalog-merge/modules/message-parity
  rollout-lab-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: modules/rollout-lab/package-lock.json
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - run: npm ci
    - run: python reference.py
    - run: npm test
    - run: node plan.js examples/checkout-plan.json demo-0090
    - run: python -m pip install -r modules/exposure-audit/requirements.txt
    - run: node examples/stage-audit.mjs
    - run: npx playwright install --with-deps chromium
    - run: npm run test:e2e
    defaults:
      run:
        working-directory: modules/rollout-lab
  rollout-lab-exposure-audit-verify:
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: modules/rollout-lab/modules/exposure-audit/requirements.txt
    - run: python -m pip install -r requirements.txt
    - run: python -m unittest -v
    - uses: actions/checkout@v7
      with:
        ref: 3cc291b20b147e53544504454aff6f74acced583
        path: modules/rollout-lab/modules/exposure-audit/comparator
    - run: python -m pip install flit_core==3.12.0
    - run: python verify_install.py comparator
    defaults:
      run:
        working-directory: modules/rollout-lab/modules/exposure-audit
  theme-contrast-audit:
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - run: npm ci
    - run: npm test
    - run: npx playwright install --with-deps chromium firefox
    - run: npm run test:browsers
    defaults:
      run:
        working-directory: modules/theme-contrast
  frame-delta-compare:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v6
      with:
        go-version: 1.25.x
        cache: false
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - run: go vet ./...
    - run: python -m pip install Pillow==13.0.0
    - run: python -m unittest -v
    defaults:
      run:
        working-directory: modules/frame-delta
  patch-cover-patch:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - run: python -m pip install -r requirements.txt
    - run: python -m unittest -v
    - run: python demo.py
    defaults:
      run:
        working-directory: modules/patch-cover
  contract-witness-verify:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
        python:
        - '3.12'
        - '3.13'
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}
    - run: python -m pip install -r requirements-test.txt
    - run: python -m unittest -v
    defaults:
      run:
        working-directory: modules/contract-witness
  wheel-witness-test:
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - run: python -m pip install -r requirements-test.txt
    - run: python -m unittest -v
    defaults:
      run:
        working-directory: modules/wheel-witness
  plugin-fit-verify:
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: modules/plugin-fit/go.mod
        cache: false
    - run: go vet ./...
    - run: go test -v ./...
    - run: go run ./cmd/plugin-fit examples/editor.json
    defaults:
      run:
        working-directory: modules/plugin-fit
